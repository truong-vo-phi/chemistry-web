<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Game: Chuẩn Độ Axit-Bazo</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1e293b, #0f172a); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .glass-container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 40px; text-align: center; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); max-width: 500px; }
        h2 { margin-top: 0; color: #38bdf8; }
        p { color: #cbd5e1; line-height: 1.6; }
        .btn { margin-top: 20px; padding: 15px 30px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
        .btn-play { background: #38bdf8; color: #0f172a; }
        .btn-play:hover { background: #0ea5e9; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }
    </style>
</head>
<body>
    <div class="glass-container">
        <h2>🧪 Lab 1: Chuẩn Độ Axit - Bazo</h2>
        <p>Đây là khung chứa HTML Game mô phỏng.<br>Ở Giai đoạn 2, khu vực này sẽ được thay thế bằng Canvas của Unity WebGL.</p>
        <button class="btn btn-play" onclick="completeLab()">Hoàn thành thí nghiệm (Random Điểm)</button>
    </div>

    <script>
        function completeLab() {
            // Random điểm từ 70 đến 100
            const randomScore = Math.floor(Math.random() * (100 - 70 + 1)) + 70;
            
            // postMessage dùng để Gửi dữ liệu ra file HTML cha (giao diện bài học)
            window.parent.postMessage({
                type: 'PRACTICE_COMPLETED',
                score: randomScore
            }, '*'); 
            
            alert('Đã gửi điểm (' + randomScore + ') từ iframe game lên giao diện cha!');
        }
    </script>
</body>
</html>
